```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TempTracker - Tu compañero climático</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="contenedor">

        <h1>TempTracker</h1>
        <p class="subtitulo">Tu compañero climático</p>

        <div class="buscador">
            <input 
                type="text" 
                id="input-ciudad" 
                placeholder="Escribe una ciudad..."
            >

            <button id="btn-buscar">
                Buscar
            </button>
        </div>

        <div class="clima-info">

            <h2 id="nombre-ciudad">Ciudad</h2>

            <img 
                id="imagen-clima" 
                src="clima.png" 
                alt="Imagen del clima"
            >

            <p id="condicion">Condición del clima</p>

            <p>
                Temperatura:
                <span id="temperatura">--</span> °C
            </p>

            <p>
                Humedad:
                <span id="humedad">--</span> %
            </p>

            <p>
                Velocidad del viento:
                <span id="viento">--</span> km/h
            </p>

        </div>
       
         <a href="https://github.com/60465337-hue" class="btn-portafolio">
         Mi Portafolio
        </a>

    </div>

    <script src="script.js"></script>

</body>
</html>
